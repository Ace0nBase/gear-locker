# Deployed automatically by Cloudflare Workers Builds on every push to main.
name = "gear-locker-api"
main = "worker.js"
compatibility_date = "2026-10-15"
workers_dev = true
# Keep any variables set in the dashboard; settings live in DEFAULTS inside worker.js.
keep_vars = true

# Price-alert storage
[[kv_namespaces]]
binding = "WATCH"
id = "3830bb679d28482db6ca2ec6e69b95f1"

# Hourly price-alert checks
[triggers]
crons = ["17 * * * *"]

# The Claude API key is a secret set in the Cloudflare dashboard
# (Worker -> Settings -> Variables and Secrets -> ANTHROPIC_API_KEY). Deploys keep it.
